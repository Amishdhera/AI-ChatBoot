<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova — AI Chat</title>
    <meta name="description" content="Nova, a premium AI chat assistant." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong theme.
      (function () {
        var saved = localStorage.getItem("nova-theme");
        var isLight = saved
          ? saved === "light"
          : window.matchMedia("(prefers-color-scheme: light)").matches;
        if (isLight) document.documentElement.classList.add("light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
